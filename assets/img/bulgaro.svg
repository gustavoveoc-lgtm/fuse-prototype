<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180f15" />
      <stop offset="50%" stop-color="#120a0f" />
      <stop offset="100%" stop-color="#0b0609" />
    </linearGradient>
    <radialGradient id="glowRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8a598" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#e8a598" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0b6aa" />
      <stop offset="100%" stop-color="#d6877b" />
    </linearGradient>
    <linearGradient id="femaleSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2cfb8" />
      <stop offset="100%" stop-color="#dfb398" />
    </linearGradient>
    <linearGradient id="apparelDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c1e26" />
      <stop offset="100%" stop-color="#1b1218" />
    </linearGradient>
    <filter id="shadowDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fundo escuro com sutil iluminação FUSE -->
  <rect width="800" height="800" fill="url(#bgGrad)" />
  <circle cx="400" cy="420" r="320" fill="url(#glowRose)" />

  <!-- Grid e piso da academia -->
  <line x1="100" y1="680" x2="700" y2="680" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
  <ellipse cx="400" cy="680" rx="260" ry="24" fill="rgba(0,0,0,0.4)" filter="url(#shadowDrop)" />

  <!-- Tag Superior: Exercício & Orientação -->
  <g transform="translate(40, 45)">
    <rect width="180" height="32" rx="16" fill="rgba(232,165,152,0.12)" stroke="rgba(232,165,152,0.3)" stroke-width="1" />
    <text x="90" y="21" fill="#e8a598" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">GUIA EDUCATIVO</text>
  </g>
  <text x="760" y="68" fill="rgba(255,255,255,0.4)" font-family="'Outfit', sans-serif" font-size="13" font-weight="600" text-anchor="end" letter-spacing="0.5">FUSE FITNESS</text>

  <!-- BANCO PARA APOIO DO PÉ POSTERIOR -->
  <g id="gym-bench" transform="translate(510, 480)">
    <!-- Almofada do Banco -->
    <rect x="0" y="0" width="160" height="28" rx="8" fill="#22181f" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    <rect x="2" y="2" width="156" height="6" rx="3" fill="rgba(232,165,152,0.2)" />
    <!-- Estrutura metálica -->
    <path d="M 30 28 L 30 200 M 130 28 L 130 200" stroke="#3d2a35" stroke-width="10" stroke-linecap="round" />
    <path d="M 10 195 L 50 195 M 110 195 L 150 195" stroke="#4d3544" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- FIGURA FEMININA EM EXECUÇÃO DO BÚLGARO -->
  <g id="female-athlete" transform="translate(180, 160)">
    
    <!-- Perna de trás apoiada no banco -->
    <!-- Coxa de trás estendendo até o banco -->
    <path d="M 220 280 C 260 300, 310 320, 350 330" stroke="#251821" stroke-width="36" stroke-linecap="round" />
    <!-- Canela/Pé no banco -->
    <path d="M 350 330 L 380 325" stroke="#251821" stroke-width="26" stroke-linecap="round" />
    <!-- Tênis atrás -->
    <path d="M 370 320 L 400 325 L 395 345 Z" fill="#e8a598" />

    <!-- Tronco e Quadril da Mulher (Inclinado levemente à frente para foco em glúteo) -->
    <!-- Glúteo Maior Ativado (com destaque rose sutil) -->
    <ellipse cx="205" cy="275" rx="36" ry="42" fill="url(#roseAccent)" opacity="0.9" />
    <text x="260" y="250" fill="#e8a598" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">GLÚTEO (FOCO)</text>
    <line x1="215" y1="260" x2="255" y2="250" stroke="#e8a598" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Tronco / Top Esportivo -->
    <path d="M 210 270 L 195 160 C 190 140, 220 130, 225 150 L 235 260 Z" fill="url(#apparelDark)" />
    <!-- Faixa do Top -->
    <path d="M 192 165 C 205 160, 225 160, 235 168 L 230 210 C 215 215, 200 215, 192 205 Z" fill="#382531" stroke="rgba(232,165,152,0.3)" stroke-width="1.5" />

    <!-- Cabeça e Cabelo (Coque Feminino Elegante) -->
    <!-- Pescoço -->
    <path d="M 210 145 L 210 115 L 222 115 L 222 145 Z" fill="url(#femaleSkin)" />
    <!-- Rosto de perfil / cabeça -->
    <circle cx="218" cy="95" r="26" fill="url(#femaleSkin)" />
    <!-- Coque clássico esportivo -->
    <path d="M 210 72 C 190 75, 195 105, 215 110 C 228 105, 235 85, 225 74 Z" fill="#2d1d17" />
    <circle cx="196" cy="80" r="14" fill="#2d1d17" /> <!-- Coque alto -->
    <circle cx="196" cy="80" r="15" fill="none" stroke="#e8a598" stroke-width="2" /> <!-- Elástico rose -->

    <!-- Braço Esquerdo segurando Halter ao lado -->
    <path d="M 218 165 L 205 240 L 195 300" stroke="url(#femaleSkin)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Halter na mão esquerda -->
    <g transform="translate(195, 300)">
      <rect x="-8" y="-5" width="16" height="10" rx="2" fill="#555" />
      <rect x="-14" y="-20" width="12" height="40" rx="3" fill="#2b2327" stroke="#e8a598" stroke-width="1" />
      <rect x="2" y="-20" width="12" height="40" rx="3" fill="#2b2327" stroke="#e8a598" stroke-width="1" />
    </g>

    <!-- Perna da frente (Flexionada em 90 graus - Biomecânica Perfeita) -->
    <!-- Coxa frontal (Quadríceps) -->
    <path d="M 195 285 L 105 340" stroke="url(#apparelDark)" stroke-width="38" stroke-linecap="round" />
    <!-- Joelho alinhado ao tornozelo -->
    <circle cx="100" cy="345" r="18" fill="url(#apparelDark)" />
    <!-- Canela vertical (90 graus com o solo) -->
    <path d="M 100 345 L 100 480" stroke="url(#apparelDark)" stroke-width="28" stroke-linecap="round" />
    <!-- Tênis frontal elegante -->
    <path d="M 85 480 L 140 480 L 135 500 L 75 500 Z" fill="#e8a598" rx="4" />
    <path d="M 75 496 L 140 496 L 138 502 L 75 502 Z" fill="#fff" />

    <!-- Vetor Indicador de Movimento (Seta Dupla Vertical para Descida e Subida) -->
    <g transform="translate(50, 310)">
      <line x1="0" y1="0" x2="0" y2="120" stroke="#e8a598" stroke-width="3" stroke-dasharray="6,4" />
      <!-- Seta baixo -->
      <polygon points="-6,115 6,115 0,130" fill="#e8a598" />
      <!-- Seta cima -->
      <polygon points="-6,15 6,15 0,0" fill="#e8a598" />
      <text x="-12" y="70" fill="#e8a598" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" text-anchor="end">90°</text>
    </g>

  </g>

  <!-- Rodapé com Informação Oficial -->
  <rect x="40" y="710" width="720" height="50" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  <text x="60" y="741" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">04 — BÚLGARO</text>
  <text x="720" y="741" fill="var(--accent-rose, #e8a598)" font-family="'Outfit', sans-serif" font-size="13" font-weight="600" text-anchor="end">4 séries × 12 reps • Descanso 90s</text>

</svg>
